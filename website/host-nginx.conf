# 宿主机 nginx 的站点文件：HTTPS 在这里终止，整站反代到容器绑在 127.0.0.1:9800 上的 nginx（compose.yaml）。
# 放在服务器的 /etc/nginx/sites-available/orangespeakeasy-site，软链进 sites-enabled；改完 `sudo nginx -t` 通过才 reload。
# 证书用 certbot 签（webroot 走下面的 ACME 目录），续期后自动 reload nginx。
# 同机还有别的站：只是多一个这样的文件，server_name、upstream 名和端口各不相同。

upstream orangespeakeasy_site {
    server 127.0.0.1:9800;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name orangespeakeasy.zephyrxiang.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orangespeakeasy.zephyrxiang.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/orangespeakeasy.zephyrxiang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orangespeakeasy.zephyrxiang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/orangespeakeasy_site_access.log combined;
    error_log /var/log/nginx/orangespeakeasy_site_error.log warn;

    # 别的安全头由容器里的 nginx 加，这里再加会出现两遍；HSTS 只在 HTTPS 这一层才有意义
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 静态页，只读
    client_max_body_size 16k;

    location / {
        proxy_pass http://orangespeakeasy_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
